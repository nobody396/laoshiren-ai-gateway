name: Build immutable Docker image

# This workflow has no push or manual trigger. The required CI workflow is its
# only caller, so image publication cannot race ahead of backend integration,
# frontend, and production-image gates.
on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full commit SHA checked and built by the caller
        required: true
        type: string
      publish:
        description: Push the exact commit tag after all caller gates pass
        required: true
        type: boolean
    outputs:
      image_ref:
        description: Immutable registry reference (image@sha256:...)
        value: ${{ jobs.build.outputs.image_ref }}
      maintenance_image_ref:
        description: Immutable maintenance registry reference (image@sha256:...)
        value: ${{ jobs.build.outputs.maintenance_image_ref }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MAINTENANCE_IMAGE_NAME: ${{ github.repository }}-maintenance

jobs:
  build:
    name: Build exact linux/amd64 commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      maintenance_image_ref: ${{ steps.resolve.outputs.maintenance_image_ref }}

    steps:
      - name: Validate immutable commit input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          }

      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.commit_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "docker_build_commit_sha=${actual_sha}"
          test "$actual_sha" = "$EXPECTED_SHA"
          python3 tools/release/release_contract.py validate-publish \
            --image-tag "$IMAGE_TAG" \
            --expected-commit "$EXPECTED_SHA"

      - name: Test immutable release contract
        run: python3 tools/release/test_release_contract.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact commit image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.commit_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit_sha }}

      - name: Build exact maintenance image
        id: maintenance_build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/maintenance
          file: ./deploy/maintenance/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,mode=max,scope=maintenance
          tags: ${{ env.REGISTRY }}/${{ env.MAINTENANCE_IMAGE_NAME }}:${{ inputs.commit_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit_sha }}

      - name: Resolve and verify registry digest
        if: ${{ inputs.publish }}
        id: resolve
        shell: bash
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.commit_sha }}
          MAINTENANCE_IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.MAINTENANCE_IMAGE_NAME }}:${{ inputs.commit_sha }}
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_MAINTENANCE_BUILD_DIGEST: ${{ steps.maintenance_build.outputs.digest }}
        run: |
          image_ref="$(bash tools/release/resolve_image_digest.sh \
            "$IMAGE_TAG" \
            "$EXPECTED_SHA" \
            "$EXPECTED_BUILD_DIGEST")"
          maintenance_image_ref="$(bash tools/release/resolve_image_digest.sh \
            "$MAINTENANCE_IMAGE_TAG" \
            "$EXPECTED_SHA" \
            "$EXPECTED_MAINTENANCE_BUILD_DIGEST")"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "maintenance_image_ref=$maintenance_image_ref" >> "$GITHUB_OUTPUT"
          {
            echo "commit_sha=$EXPECTED_SHA"
            echo "image_ref=$image_ref"
            echo "build_digest=$EXPECTED_BUILD_DIGEST"
            echo "maintenance_image_ref=$maintenance_image_ref"
            echo "maintenance_build_digest=$EXPECTED_MAINTENANCE_BUILD_DIGEST"
          } > immutable-image.env
          echo "Published immutable image: \`$image_ref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Published immutable maintenance image: \`$maintenance_image_ref\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release metadata
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: immutable-image-${{ inputs.commit_sha }}
          path: immutable-image.env
          if-no-files-found: error
          retention-days: 30

      - name: Record pull-request build
        if: ${{ !inputs.publish }}
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: echo "Built exact commit $EXPECTED_SHA without publishing"
