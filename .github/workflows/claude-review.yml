# =============================================================================
# Claude AI 代码审查
# =============================================================================
# 触发时机：每次 PR 被打开 / 推送新 commit / 重新打开时,Claude 自动审查改动
# 也支持 PR 评论里 @claude xxx 让 Claude 回答问题或做小改动
#
# 需要的 Secret(在 GitHub 仓库 Settings → Secrets and variables → Actions 里加):
#   - ANTHROPIC_API_KEY: 从 https://console.anthropic.com/ 拿
# =============================================================================

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 评论里 @claude 也能触发(用于追问或让 Claude 改代码)
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # 注意:不给 contents: write — 防止 prompt injection 让 Claude 误推代码

jobs:
  review:
    # 不审查机器人发的 PR / 评论,避免循环触发和浪费 API
    # 也过滤掉纯 Issue 评论(不是 PR 的评论),节省 API 额度
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name != 'issue_comment' ||
        github.event.issue.pull_request
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 拉完整历史,Claude 才能看到对比信息
          fetch-depth: 0

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 控制成本:限制最多回合数(每个回合 = 一次工具调用)
          # 一般 10-15 够审查中等大小的 PR;大 PR 可以调到 20
          claude_args: '--max-turns 15 --model claude-sonnet-4-5'
          # 只允许 Claude 调用「读」和「评论」类工具,不允许它推代码或合并 PR
          allowed_tools: |
            mcp__github_inline_comment__create_inline_comment
            Bash(gh pr comment:*)
            Bash(gh pr diff:*)
            Bash(gh pr view:*)
            Bash(gh pr checks:*)
          prompt: |
            你正在审查 laoshirenai-gateway 项目的 PR。这是一个生产网站 (laoshirenai.com) 的代码,
            后端 Go (entgo ORM)、前端 Vue + Vite + TypeScript、Docker 部署到 Dokploy。

            ## 审查重点

            请按以下优先级审查这次 PR:

            1. **正确性 & 逻辑 bug**:有没有明显的逻辑错误、边界条件遗漏、并发问题?
            2. **安全**:有没有 SQL 注入、XSS、未校验的用户输入、敏感信息泄露、未鉴权的接口?
               尤其关注 secrets/token/密码的处理、OAuth 流程、admin 权限边界。
            3. **稳定性**:错误处理是否完整?有没有可能 panic、unhandled rejection、goroutine 泄漏?
            4. **数据库 / migrations**:如果改了 ent schema,有没有生成对应 migration?会不会破坏现有数据?
            5. **前后端契约**:接口字段、类型有没有前后端不一致?
            6. **测试**:核心逻辑有没有覆盖?Makefile 里 `make test` 应该能通过。
            7. **风格 & 可读性**:命名、注释、可维护性。优先级最低,只挑特别明显的问题说。

            ## 审查方式

            - 用 `gh pr diff` 看改动,用 `gh pr view` 看 PR 描述。
            - **每个具体问题用 inline comment 贴在对应行上**,简短直接,说清「问题 + 建议怎么改」。
            - 最后用一条总评 (`gh pr comment`) 总结:有几个阻塞性问题 / 几个建议 / 整体是否可以合并。
            - 评论用中文写。
            - **不要瞎夸**。如果代码没问题,就简短说「LGTM,没看到明显问题」即可,不要堆砌套话。
            - 对照项目 AGENTS.md 的规则审查 (commit message 格式、是否动了生产部署相关的东西等)。

            ## 不要做的事

            - 不要直接修改代码或推 commit,只评论。
            - 不要 approve / request changes (用普通 comment 就行,最终决定权在人)。
            - 不要重复评论已经评过的点。
