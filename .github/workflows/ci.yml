name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Record tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "ci_commit_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run backend test entrypoint
        run: make test-backend

  backend-integration:
    name: Backend deterministic integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Record tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "ci_commit_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Docker integration runtime
        run: |
          docker version
          docker info --format 'docker_server_version={{.ServerVersion}}'
          echo "postgres_image=postgres:18.1-alpine3.23"
          echo "redis_image=redis:8.4-alpine"

      - name: Run deterministic backend integration gate
        run: make test-backend-integration

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Record tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "ci_commit_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run frontend typecheck
        run: pnpm --dir frontend run typecheck

      - name: Enforce frontend dependency boundaries
        run: pnpm --dir frontend run boundary:check

      - name: Run frontend tests
        run: pnpm --dir frontend run test:run

      - name: Build frontend
        run: pnpm --dir frontend run build

      - name: Enforce frontend bundle budget
        run: pnpm --dir frontend run bundle:check:test && pnpm --dir frontend run bundle:check

  docker:
    name: Production Docker build
    needs:
      - backend
      - backend-integration
      - frontend
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      commit_sha: ${{ github.sha }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
