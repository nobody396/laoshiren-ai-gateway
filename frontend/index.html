    <script nonce="__CSP_NONCE_VALUE__">
      ;(function () {
        var root = document.documentElement
        var retryKey = 'laoshirenai-app-load-retry'
        var slowTimer

        root.classList.add('js')

        function updateStatus(title, message) {
          var titleNode = document.getElementById('app-load-title')
          var messageNode = document.getElementById('app-load-message')
          if (titleNode) titleNode.textContent = title
          if (messageNode) messageNode.textContent = message
        }

        function reload() {
          try {
            window.sessionStorage.removeItem(retryKey)
          } catch (_) {}
          window.location.reload()
        }

        function retryOnce() {
          try {
            if (window.sessionStorage.getItem(retryKey) === '1') return false
            window.sessionStorage.setItem(retryKey, '1')
          } catch (_) {
            return false
          }

          window.setTimeout(function () {
            window.location.reload()
          }, 1500)
          return true
        }

        function markSlow() {
          if (root.classList.contains('app-mounted')) return
          root.classList.add('app-load-slow')
          updateStatus('网络加载较慢', '请继续等待，或者点击重新加载。')
        }

        function fail(reason) {
          if (root.classList.contains('app-mounted')) return
          window.clearTimeout(slowTimer)
          root.classList.remove('app-load-slow')
          root.classList.add('app-load-failed')

          var willRetry = reason !== 'manual' && retryOnce()
          updateStatus(
            '页面加载没有完成',
            willRetry ? '正在自动重试，请稍候。' : '请点击重新加载，或更换网络后再试。'
          )
        }

        function succeed() {
          window.clearTimeout(slowTimer)
          root.classList.remove('app-load-slow', 'app-load-failed')
          root.classList.add('app-mounted')
          try {
            window.sessionStorage.removeItem(retryKey)
          } catch (_) {}
        }

        slowTimer = window.setTimeout(markSlow, 15000)
        window.__APP_LOAD_STATE__ = { fail: fail, markSlow: markSlow, succeed: succeed }

        window.addEventListener(
          'error',
          function (event) {
            if (root.classList.contains('app-mounted')) return
            var target = event.target
            if (target && target.tagName === 'SCRIPT') {
              fail('script')
              return
            }
            if (event.error) fail('runtime')
          },
          true
        )

        window.addEventListener('unhandledrejection', function () {
          if (!root.classList.contains('app-mounted')) fail('promise')
        })

        document.addEventListener('DOMContentLoaded', function () {
          var retryButton = document.getElementById('app-load-retry')
          if (retryButton) retryButton.addEventListener('click', reload)
        })
      })()
    </script>
    <style>
      html.js .seo-static-content {
        display: none !important;
      }

      #app-load-status {
        display: none;
      }

      html.js:not(.app-mounted) #app-load-status {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8f3e7;
        color: #1f1a12;
        opacity: 0;
        animation: app-load-reveal 180ms ease 600ms forwards;
      }

      #app-load-card {
        width: min(420px, 100%);
        padding: 32px 28px;
        border: 1px solid #d7c8a7;
        border-radius: 20px;
        background: #faf6ec;
        box-shadow: 0 24px 70px rgba(31, 26, 18, 0.12);
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      #app-load-spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 18px;
        border: 3px solid #d7c8a7;
        border-top-color: #9a3b1f;
        border-radius: 999px;
        animation: app-load-spin 800ms linear infinite;
      }

      html.app-load-failed #app-load-spinner {
        border-color: #9a3b1f;
        animation: none;
      }

      #app-load-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
      }

      #app-load-message {
        margin: 10px 0 0;
        color: #6f624d;
        font-size: 14px;
        line-height: 1.7;
      }

      #app-load-retry {
        display: none;
        margin: 22px auto 0;
        padding: 10px 20px;
        border: 0;
        border-radius: 999px;
        background: #9a3b1f;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      html.app-load-slow #app-load-retry,
      html.app-load-failed #app-load-retry {
        display: inline-flex;
      }

      @keyframes app-load-reveal {
        to {
          opacity: 1;
        }
      }

      @keyframes app-load-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html.js:not(.app-mounted) #app-load-status {
          animation-delay: 0ms;
        }

        #app-load-spinner {
          animation-duration: 1600ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-load-status" role="status" aria-live="polite" aria-atomic="true">
      <div id="app-load-card">
        <div id="app-load-spinner" aria-hidden="true"></div>
        <h1 id="app-load-title">正在打开老实人AI</h1>
        <p id="app-load-message">首次加载可能需要一点时间，请稍候。</p>
        <button id="app-load-retry" type="button">重新加载</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
