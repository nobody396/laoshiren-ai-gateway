name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      integration: ${{ steps.classify.outputs.integration }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docker: ${{ steps.classify.outputs.docker }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify generated model catalog
        run: |
          python3 scripts/model_catalog.py check
          python3 scripts/test_model_catalog.py
          # Offline fixtures only: these tests must never resolve an owned key.
          python3 -m unittest discover -s tests -p 'test_provider_contract*.py'
          python3 -m unittest discover -s tests -p 'test_model*.py'
          python3 -m unittest discover -s tests -p 'test_matrix_schema.py'

      - name: Resolve changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf '%s\n' .github/workflows/ci.yml > changed-paths.txt
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" --depth=2 || \
                git fetch --no-tags origin "$BASE_REF" "$HEAD_REF" --depth=2
            fi
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          fi
          echo "Changed paths:"
          cat changed-paths.txt

      - name: Classify safe CI matrix
        id: classify
        run: |
          python3 tools/ci/classify_changes.py \
            --paths-file changed-paths.txt \
            --github-output "$GITHUB_OUTPUT"

  release-proof:
    name: Verify tested tree for Main fast path
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve successful PR tree attestation
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            python3 tools/ci/tested_tree.py resolve \
              --repo . \
              --repository "$REPOSITORY" \
              --commit-sha "$COMMIT_SHA" \
              --output tested-tree-decision.json
          else
            printf '%s\n' '{"fast_path":false,"reason":"not_main_push"}' > tested-tree-decision.json
          fi
          cat tested-tree-decision.json
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          result = json.load(open("tested-tree-decision.json", encoding="utf-8"))
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"fast_path={'true' if result.get('fast_path') else 'false'}\n")
              output.write(f"reason={result.get('reason', 'unknown')}\n")
          PY

      - name: Record fast-path decision
        run: |
          echo "Fast path: ${{ steps.decide.outputs.fast_path }}"
          echo "Reason: ${{ steps.decide.outputs.reason }}"

  backend:
    name: Backend tests and lint
    needs: [changes, release-proof]
    if: ${{ needs.release-proof.outputs.fast_path != 'true' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Record tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install golangci-lint
        working-directory: backend
        run: |
          lint_bin="$(go env GOPATH)/bin/golangci-lint"
          if [[ ! -x "$lint_bin" ]] || ! "$lint_bin" version | grep -q '2.13.2'; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run backend test entrypoint
        run: make test-backend

  backend-integration:
    name: Backend deterministic integration gate
    needs: [changes, release-proof]
    if: ${{ needs.release-proof.outputs.fast_path != 'true' && needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Record tested commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify Docker integration runtime
        run: |
          docker version
          docker info --format 'docker_server_version={{.ServerVersion}}'
      - name: Run deterministic backend integration gate
        run: make test-backend-integration

  frontend-tests:
    name: Frontend tests and boundaries
    needs: [changes, release-proof]
    if: ${{ needs.release-proof.outputs.fast_path != 'true' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Enforce frontend dependency boundaries
        run: pnpm --dir frontend run boundary:check
      - name: Run frontend tests
        run: pnpm --dir frontend run test:run

  frontend-build:
    name: Frontend production build and budget
    needs: [changes, release-proof]
    if: ${{ needs.release-proof.outputs.fast_path != 'true' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir frontend run build
      - name: Enforce frontend bundle budget
        run: pnpm --dir frontend run bundle:check:test && pnpm --dir frontend run bundle:check

  windows-auto-config:
    name: Windows auto-config execution policy regression
    needs: [changes, release-proof]
    if: ${{ needs.release-proof.outputs.fast_path != 'true' && needs.changes.outputs.frontend == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Windows installer under Restricted execution policy
        shell: pwsh
        run: ./frontend/scripts/test-windows-auto-config.ps1
      - name: Verify Windows resource installer under Restricted execution policy
        shell: pwsh
        run: ./frontend/scripts/test-windows-resource-install-command.ps1
      - name: Verify Windows installer in Windows PowerShell 5.1
        shell: powershell
        run: ./frontend/scripts/test-windows-auto-config.ps1
      - name: Verify Windows resource installer in Windows PowerShell 5.1
        shell: powershell
        run: ./frontend/scripts/test-windows-resource-install-command.ps1

  docker-pr:
    name: PR Docker prebuild
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      commit_sha: ${{ github.sha }}
      publish: false

  attest-pr:
    name: Record successful PR tree
    needs:
      - changes
      - release-proof
      - backend
      - backend-integration
      - frontend-tests
      - frontend-build
      - windows-auto-config
      - docker-pr
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          (needs.changes.outputs.backend != 'true' || needs.backend.result == 'success') &&
          (needs.changes.outputs.integration != 'true' || needs.backend-integration.result == 'success') &&
          (needs.changes.outputs.frontend != 'true' ||
            (needs.frontend-tests.result == 'success' && needs.frontend-build.result == 'success' &&
             needs.windows-auto-config.result == 'success')) &&
          (needs.changes.outputs.docker != 'true' || needs.docker-pr.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested merge commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Record tested tree attestation
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/ci/tested_tree.py record \
            --repo . \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --run-id "$RUN_ID" \
            --output tested-tree.json
          cat tested-tree.json
      - name: Upload tested tree attestation
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ github.event.pull_request.head.sha }}
          path: tested-tree.json
          if-no-files-found: error
          retention-days: 30

  docker-main:
    name: Production Docker publish
    needs:
      - changes
      - release-proof
      - backend
      - backend-integration
      - frontend-tests
      - frontend-build
      - windows-auto-config
    if: >-
      ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          needs.changes.outputs.docker == 'true' &&
          (needs.release-proof.outputs.fast_path == 'true' ||
            ((needs.changes.outputs.backend != 'true' || needs.backend.result == 'success') &&
             (needs.changes.outputs.integration != 'true' || needs.backend-integration.result == 'success') &&
             (needs.changes.outputs.frontend != 'true' ||
               (needs.frontend-tests.result == 'success' && needs.frontend-build.result == 'success' &&
                needs.windows-auto-config.result == 'success')))) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      commit_sha: ${{ github.sha }}
      publish: true

  required:
    name: Required CI gate
    needs:
      - changes
      - release-proof
      - backend
      - backend-integration
      - frontend-tests
      - frontend-build
      - windows-auto-config
      - docker-pr
      - attest-pr
      - docker-main
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required outcome
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          failures = [name for name, value in needs.items() if value.get('result') in {'failure', 'cancelled'}]
          if failures:
              print('Required jobs failed or were cancelled: ' + ', '.join(failures), file=sys.stderr)
              raise SystemExit(1)
          event = os.environ['EVENT_NAME']
          if event == 'pull_request' and needs['attest-pr']['result'] != 'success':
              print('PR tree attestation was not produced.', file=sys.stderr)
              raise SystemExit(1)
          if event in {'push', 'workflow_dispatch'} and needs['changes']['outputs'].get('docker') == 'true':
              if needs['docker-main']['result'] != 'success':
                  print('Production image was not published.', file=sys.stderr)
                  raise SystemExit(1)
          print('Required CI gate passed.')
          PY
