worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not write request URLs or query strings to container logs while the
    # normal application is unavailable. Clients may still send credentials.
    access_log off;
    server_tokens off;
    etag off;
    gzip off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;

        add_header Retry-After "300" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        # Container-local health only. Public liveness/readiness paths below
        # intentionally keep returning the maintenance JSON response.
        location = /__maintenance_health {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            add_header Cache-Control "no-store" always;
            return 204;
        }

        # Product API, OpenAI-compatible, Gemini, Antigravity and image paths
        # must remain machine-readable while the application is stopped.
        location ~ ^/(?:api|v1|v1beta|antigravity|gpt-image|responses|chat|images|setup)(?:/|$) {
            default_type application/json;
            return 503 '{"error":{"type":"service_unavailable","code":"maintenance","message":"Service is temporarily unavailable for scheduled maintenance.","retry_after_seconds":300}}';
        }

        location ~ ^/(?:health|livez|readyz)$ {
            default_type application/json;
            return 503 '{"error":{"type":"service_unavailable","code":"maintenance","message":"Service is temporarily unavailable for scheduled maintenance.","retry_after_seconds":300}}';
        }

        # Every browser route returns the same static document with status 503.
        # The internal redirect preserves the status instead of serving a 200.
        location / {
            error_page 503 =503 /index.html;
            return 503;
        }

        location = /index.html {
            internal;
        }
    }
}
