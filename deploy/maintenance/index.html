<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>系统维护中｜老实人 AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(79, 111, 255, 0.14), transparent 42%),
          #f5f7fb;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 7vw, 56px);
        border: 1px solid rgba(23, 32, 51, 0.09);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 70px rgba(39, 54, 92, 0.12);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        padding: 7px 12px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4058c7;
        font-size: 14px;
        font-weight: 700;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5b72e8;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 44px);
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin: 18px 0 0;
        color: #526079;
        font-size: 17px;
        line-height: 1.8;
      }

      .window {
        margin-top: 28px;
        padding: 18px 20px;
        border-radius: 16px;
        background: #f7f8fc;
      }

      .window-label {
        display: block;
        margin-bottom: 6px;
        color: #707b91;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      time {
        font-size: 18px;
        font-weight: 760;
      }

      footer {
        margin-top: 28px;
        color: #8892a5;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge"><span class="dot"></span>计划内维护</div>
      <h1>系统正在维护中</h1>
      <p>
        为提升服务稳定性，我们正在进行计划内维护。维护期间网站与 API
        将暂时不可用，完成后会尽快恢复服务。感谢你的理解与耐心等待。
      </p>
      <section class="window" aria-label="维护时间">
        <span class="window-label">北京时间（UTC+8）</span>
        <time datetime="2026-07-11T01:00:00+08:00">
          2026 年 7 月 11 日 01:00–05:00
        </time>
      </section>
      <footer>老实人 AI</footer>
    </main>
  </body>
</html>
